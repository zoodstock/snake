name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulation tests
        run: node tests/logic.test.mjs

      - name: Renderer smoke test
        run: node --import ./tests/register-three-stub.mjs tests/renderer.smoke.mjs

      # The renderer needs a browser, so guard the next best thing: serve the
      # page and prove every import in the module graph resolves.
      - name: Module graph check
        run: |
          python3 -m http.server 8123 &
          sleep 2
          node tests/modules.check.mjs http://127.0.0.1:8123
