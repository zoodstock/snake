name: Deploy to GitHub Pages

# The site is plain static files — index.html plus the ES modules under src/ —
# so "building" is just uploading the repo. Tests gate the deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulation tests
        run: node tests/logic.test.mjs

      - name: Renderer smoke test
        run: node --import ./tests/register-three-stub.mjs tests/renderer.smoke.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site has no build step, so this is the one thing rewritten on the way
      # out: the version module's BUILD line, so the deployed page shows which
      # commit it came from. Fails the deploy if the line is not found, rather than
      # silently publishing a page that still claims to be 'dev'.
      - name: Stamp the build into src/version.js
        run: |
          stamp="${GITHUB_SHA:0:7} $(date -u +%Y-%m-%d)"
          sed -i "s|^export const BUILD = 'dev';$|export const BUILD = '${stamp}';|" src/version.js
          grep -qF "export const BUILD = '${stamp}';" src/version.js
          echo "stamped: ${stamp}"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on for the repository if it is not enabled yet.
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
