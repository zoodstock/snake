<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Block Snake</title>
<style>
  :root {
    --ink: #08130d;
    --panel: rgba(8, 22, 15, 0.58);
    --line: rgba(255, 255, 255, 0.16);
    --green: #7cec62;
    --gold: #ffc63c;
    --text: #eaf6ee;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #7fb8d8;
    color: var(--text);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  #scene {
    position: fixed;
    inset: 0;
    outline: none;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: crosshair;
  }

  .hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 16px;
  }

  .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    backdrop-filter: blur(6px);
    padding: 10px 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  }

  .stat-group { display: flex; gap: 18px; align-items: baseline; }
  .stat { display: flex; flex-direction: column; line-height: 1.1; }
  .stat b {
    font-size: 26px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
  }
  .stat span {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.6px;
    opacity: 0.65;
  }
  #combo { color: var(--gold); font-size: 20px; min-width: 34px; }

  .boost-wrap { width: 150px; }
  .boost-label {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.6px;
    opacity: 0.7;
    margin-bottom: 5px;
  }
  .boost-track {
    height: 8px;
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }
  #boostFill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #4fd0ff, #8affc1);
    transition: width 0.08s linear;
  }
  #boostFill.low { background: linear-gradient(90deg, #ff7a59, #ffd166); }

  #minimap {
    width: 148px;
    height: 148px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: rgba(8, 22, 15, 0.5);
  }

  .keys {
    font-size: 12px;
    opacity: 0.8;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  kbd {
    display: inline-block;
    min-width: 20px;
    text-align: center;
    padding: 2px 6px;
    margin: 0 1px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-bottom-width: 2px;
    background: rgba(255, 255, 255, 0.1);
    font-family: inherit;
    font-size: 11px;
  }

  #flash {
    position: fixed;
    left: 50%;
    top: 22%;
    transform: translate(-50%, 0) scale(0.9);
    font-size: 34px;
    font-weight: bold;
    text-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
    opacity: 0;
    transition: opacity 0.18s ease, transform 0.18s ease;
    pointer-events: none;
  }
  #flash.visible { opacity: 1; transform: translate(-50%, -8px) scale(1); }
  #flash.gold { color: var(--gold); }

  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    background: radial-gradient(circle at 50% 45%, rgba(4, 16, 10, 0.55), rgba(4, 12, 8, 0.85));
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    padding: 24px;
  }
  #overlay.visible { opacity: 1; pointer-events: auto; }

  #overlayTitle {
    margin: 0;
    font-size: clamp(38px, 9vw, 84px);
    letter-spacing: 6px;
    color: var(--green);
    text-shadow: 0 6px 0 #2d7a28, 0 10px 26px rgba(0, 0, 0, 0.5);
  }
  #overlayBody { margin: 0; max-width: 30rem; font-size: 16px; line-height: 1.55; opacity: 0.92; }
  #overlayBody .stats {
    display: block;
    margin-top: 12px;
    font-size: 14px;
    opacity: 0.85;
    letter-spacing: 0.4px;
  }
  #overlayHint { font-size: 13px; opacity: 0.8; }

  .btn {
    pointer-events: auto;
    cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-bottom-width: 3px;
    background: rgba(124, 236, 98, 0.16);
    color: var(--text);
    font: inherit;
    font-size: 15px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    padding: 10px 22px;
    border-radius: 10px;
  }
  .btn:hover { background: rgba(124, 236, 98, 0.28); }
  .btn:focus-visible, .chip:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  .corner-actions { display: flex; gap: 8px; pointer-events: auto; }
  .chip {
    pointer-events: auto;
    cursor: pointer;
    font: inherit;
    font-size: 11px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
  }

  #fatal {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 32px;
    text-align: center;
    background: #10222c;
    font-size: 16px;
    line-height: 1.6;
  }
  #fatal.visible { display: flex; }

  @media (max-width: 620px) {
    #minimap { width: 96px; height: 96px; }
    .stat b { font-size: 20px; }
    .boost-wrap { width: 110px; }
    .keys { display: none; }
  }
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="Block Snake game view"></canvas>

<div class="hud">
  <div class="row">
    <div class="panel stat-group">
      <div class="stat"><b id="score">0</b><span>score</span></div>
      <div class="stat"><b id="length">9</b><span>length</span></div>
      <div class="stat"><b id="best">0</b><span>best</span></div>
      <div class="stat"><b id="rivals">3</b><span>rivals</span></div>
      <div class="stat"><b id="combo"></b><span>combo</span></div>
    </div>
    <div class="corner-actions">
      <button class="chip" data-action="pause">pause</button>
      <button class="chip" data-action="mute"><span id="muteBadge">sound on</span></button>
    </div>
  </div>

  <div class="row" style="align-items: flex-end;">
    <div>
      <div class="panel boost-wrap">
        <div class="boost-label"><span>boost</span><span>shift</span></div>
        <div class="boost-track"><div id="boostFill"></div></div>
      </div>
      <div class="keys panel" style="margin-top: 10px;">
        <span><kbd>A</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>→</kbd> steer</span>
        <span><kbd>Shift</kbd> boost</span>
        <span><kbd>P</kbd> pause</span>
        <span><kbd>M</kbd> mute</span>
        <span>wheel = zoom · drag = steer</span>
      </div>
    </div>
    <canvas id="minimap" width="148" height="148"></canvas>
  </div>
</div>

<div id="flash"></div>

<div id="overlay">
  <h1 id="overlayTitle">BLOCK SNAKE</h1>
  <p id="overlayBody"></p>
  <button class="btn" data-action="start">Slither</button>
  <div id="overlayHint"></div>
</div>

<div id="fatal"></div>

<script src="src/math3d.js"></script>
<script src="src/glcore.js"></script>
<script src="src/snake.js"></script>
<script src="src/world.js"></script>
<script src="src/render.js"></script>
<script src="src/camera.js"></script>
<script src="src/input.js"></script>
<script src="src/audio.js"></script>
<script src="src/main.js"></script>
</body>
</html>
